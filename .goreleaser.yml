# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser v2 配置（v1 → v2 迁移要点见 https://goreleaser.com/deprecations/）
version: 2

project_name: rtfd

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X pkg.tcw.im/rtfd/v2/cmd.built={{.Date}}
      - -X pkg.tcw.im/rtfd/v2/cmd.commitID={{.Commit}}
    goos:
      - linux
    goarch:
      - amd64
      - 386
      - arm64

archives:
  # v2：单数 format 已弃用，改用复数 formats（默认即 [tar.gz]，此处显式声明）
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{- .Binary }}.
      {{- .Version }}.
      {{- title .Os }}.
      {{- if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}

checksum:
  name_template: 'checksums.txt'

snapshot:
  # v2：name_template 已弃用，改用 version_template
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - 'README.*\.md'
      - 'NOTICE'
      - '\.github'
