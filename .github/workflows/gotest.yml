name: Go test

on: [push, pull_request]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.26"

    - name: Test
      run: go test -v -count=1 ./...

    - name: Check api docs up to date
      run: |
        make docs
        git diff --exit-code docs
