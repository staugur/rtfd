name: goreleaser

on:
  push:
    tags:
      - '*'

# 创建 Release / 上传产物需要 contents: write
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # GoReleaser 生成 changelog 需要完整的 git 历史与 tag
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          # 固定到 v2 大版本（v1 → v2 有配置破坏性变更）
          version: '~> v2'
          args: release --clean
        env:
          # 使用内置 GITHUB_TOKEN（配合上方 permissions 即可创建 Release），
          # 无需再维护自建 PAT；Docker 发布改由 publish.yml 监听 tag 推送触发
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
