; rtfd 配置文件默认参数。

; rtfd的数据根目录，必需，一旦初始化完成不建议更改，否则无法读取已有数据！
base_dir = /rtfd

; 不允许的文档项目名称，非必需，以英文逗号分隔（不要加多余空格），系统默认追加了www
unallowed_name =

; 设置新建项目、git检出的默认分支
default_branch = master

; 日志级别：debug 时开启详细调试输出（构建脚本调试日志、数据库SQL打印），非必需
; log_level =

[nginx]

; 生成文档的HTML托管域名后缀，必需，一旦初始化完成不建议更改。
; 如果更改托管域名，后续生成的Nginx配置会采用新域名，将会出现新旧域名共存现象。
; 补充说明：生成的文档域名格式为："文档项目名称.dn"，默认http，可以开启https！
; 示例 dn = your-domain-name.com
; 简化部署：`rtfd --init` 会读取环境变量 RTFD_NGINX_DN 自动填入本项；未设置则留空，需手动补填。
dn =

; Nginx命令路径，必需，仅能为绝对路径或在PATH内
exec = nginx

; 如果您是普通用户，需要开启 sudo = on，否则可能出现权限不足，默认on
; 使用 sudo 提权要求无密码
sudo = off

; ssl_crt 和 ssl_key 两项开启默认域名HTTPS支持。
; 当两个文件均存在时，表示ssl=on；两个文件不存在或参数为空则表示ssl=off；
; 如果为on，后续生成的Nginx配置会使用ssl配置项，即后面的以"ssl_"开头的配置项。
; 如果为off，后续生成的Nginx配置仅支持HTTP访问，不支持HTTPS访问。
; 补充说明：开启SSL要求Nginx版本大于1.15.0，配置项支持HTTP2和TLS1.3！

; SSL证书公钥，非必需
ssl_crt =

; SSL证书私钥，非必需
ssl_key =

; 生成nginx配置文件的位置
conf_dir = %(base_dir)s/nginx

; 生成nginx额外配置文件的位置
conf_ext_dir = %(conf_dir)s/ext

; 静态资源（Sphinx的_static、_images及css/js/图片/字体等）缓存时间，单位秒
; 0表示不设置缓存头，默认3600（1小时）
static_expires = 3600

; html页面是否禁用强缓存：on时响应 Cache-Control: no-cache（仍可304协商）
; 文档内容会随重建变化，建议保持on，默认on
html_nocache = on

; 是否开启文件元数据缓存（缓存fd与stat结果，文档小文件多时收益明显）
; 注意：开启后新建/变更的文件最长30秒才可见，默认on
open_file_cache = on

# Python版本配置：镜像内固定的多版本 Python，均带 pip 与 virtualenv 模块
# 键是版本号（如3、3.10、3.11、3.12），值是对应的python程序（命令或在PATH内的绝对路径）
[py]

; 可用的Python版本，必需，至少配置一项
; 3 即系统自带的 python3(=3.12)
3 = python3
3.10 = /usr/bin/python3.10
3.12 = /usr/bin/python3.12

; 新建项目默认使用的Python版本，非必需，留空表示取上方第一个可用版本
default = 3

; python默认源，非必需，默认使用操作系统配置的pip源
; index =

# 数据存储配置（关系型数据库）
[database]

; 数据库类型，支持sqlite、mysql、mariadb、pgsql（或postgres、postgresql），必需
type = sqlite

; 数据库连接串，必需
; sqlite为数据库文件路径，目录不存在会自动创建，支持 %(base_dir)s 插值
dsn = %(base_dir)s/rtfd.db

; mysql示例：user:password@tcp(127.0.0.1:3306)/rtfd?charset=utf8mb4&parseTime=True&loc=Local
; pgsql示例：host=127.0.0.1 user=rtfd password=secret dbname=rtfd port=5432 sslmode=disable

# API配置
[api]

; 监听主机，非必需，默认 0.0.0.0
host = 0.0.0.0

; 监听端口，非必需，默认5000
port = 5000

; rtfd服务对外可达地址（scheme://host:port），必需，供 GitHub App / webhook 回跳、文档挂件脚本注入使用。
; 该值为必填项，默认留空，必须手动配置；若启用 GitHub App / webhook 或需外部访问文档挂件，须填外部可达地址（如 http://docs.example.com）。
; 简化部署：`rtfd --init` 会读取环境变量 RTFD_API_SERVER_URL 自动填入本项；未设置则留空，需手动补填。
server_url =

; API管理密钥，非必需。设置后，管理类接口（项目列表/详情/创建/更新/删除、配置查询、
; 导入导出）采用 HMAC-SHA256 动态签名鉴权，需随请求携带 X-Rtfd-Ts、X-Rtfd-Nonce、X-Rtfd-Sign 三个头；
; 留空表示未配置，此时上述接口不可用。可用 `rtfd sign` 生成签名，或在 Swagger UI 首页填入密钥后自动签名。
; 注意：项目级接口（构建、更新、删除、导出、详情）也接受项目自身密钥。
secret =

# GitHub Apps 配置
[ghapp]

; 启用条件：app_id 与 private_key 同时有效（非空且私钥文件存在）即视为启用，无需单独 enable 开关
; GitHub App Name 对应的 App ID, 也是apps全局唯一标识
app_id =

; GitHub App 私钥文件路径，如，放到数据目录下： %(base_dir)s/ghapp.pem
private_key =
