user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pcre_jit on;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    use epoll;
    worker_connections 65536;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    #: 连接与传输
    keepalive_timeout 65;
    keepalive_requests 1000;
    sendfile on;
    sendfile_max_chunk 1m;
    tcp_nopush on;
    tcp_nodelay on;

    #: 项目较多时（大量server_name）需要更大的哈希表
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;
    server_names_hash_max_size 1024;
    variables_hash_max_size 1024;

    #: 压缩（Sphinx 生成的 html/css/js 收益明显）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_vary on;
    gzip_static on;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/xhtml+xml
        image/svg+xml
        image/x-icon;

    #: 静态文件元数据缓存：文档站小文件极多，缓存 fd 与 stat 结果可显著降低 IO
    #: 注意：open_file_cache_valid 有效期内新增/变更的文件最长 30s 才可见
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    #: 协商缓存（配合项目配置中 html 的 no-cache，命中 ETag 即返回 304）
    etag on;
    if_modified_since before;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    include /etc/nginx/conf.d/*.conf;
    #: rtfd 生成的项目配置（路径需与 rtfd.cfg 中 nginx.conf_dir / conf_ext_dir 一致）
    include /rtfd/nginx/*.conf;
    include /rtfd/nginx/ext/*.conf;
}
